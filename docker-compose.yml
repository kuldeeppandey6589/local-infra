
services:

  mongo:
    image: mongo:4.4.6 
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - test
    restart: unless-stopped

  backend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kuldeepofficial/test-backend:latest
    platform: linux/amd64
    container_name: test-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000  
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kuldeepofficial/test-frontend:latest
    platform: linux/amd64
    container_name: test-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=8080  

volumes:
  mongo-data:

networks:
  test:
    driver: bridge
