services:
  frontend:
    platform: linux/amd64
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: test-frontend
    ports:
      - "3000:3000"

  backend:
    platform: linux/amd64
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: test-backend
    ports:
      - "8080:8080"

  mongodb:
    platform: linux/amd64
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
